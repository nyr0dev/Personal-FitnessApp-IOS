workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.nyr0.fitnessapp"
        XCODE_PROJECT: "FitnessApp.xcodeproj"
        XCODE_SCHEME: "FitnessApp"
    scripts:
      - name: Install XcodeGen
        script: | 
          brew install xcodegen
      - name: Generate Xcode Project
        script: | 
          xcodegen generate
      - name: Build iOS App (.ipa)
        script: | 
          xcodebuild build -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Release-iphoneos/*.app
    publishing:
      email:
        recipients:
          - nyr0d.contact@gmail.com
