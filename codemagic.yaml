workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.nyr0dev.PersonalFitnessApp

    scripts:
      - name: Install dependencies
        script: |
          echo "Installing dependencies..."
          xcodebuild -version

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "Personal-FitnessApp-IOS.xcodeproj" \
            --scheme "FitnessApp"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - nyr0d.contact@gmail.com
