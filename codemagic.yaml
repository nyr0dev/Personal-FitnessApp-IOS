workflows:
  ios-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest

    scripts:
      - name: Build unsigned app
        script: |
          xcodebuild \
            -project Personal-FitnessApp-IOS.xcodeproj \
            -scheme FitnessApp \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

    artifacts:
      - build/**

    publishing:
      email:
        recipients:
          - nyr0d.contact@gmail.com
