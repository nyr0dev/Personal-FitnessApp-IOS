<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NYR0 | FITNESS</title>

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NYR0">
    <meta name="theme-color" content="#000000">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="date-section">
                    <span class="date-label" id="current-date"></span>
                    <span class="date-day" id="current-day"></span>
                </div>
                <div class="streak-badge" id="streak-badge">
                    <span class="streak-fire">🔥</span>
                    <span class="streak-num" id="streak-count">0</span>
                    <span class="streak-label">days</span>
                </div>
            </div>
            <h1 class="page-title" id="main-heading">DAILY WORKOUT</h1>
        </header>

        <!-- Stats -->
        <div class="stats-row" id="stats-row">
            <div class="stat-card">
                <div class="stat-ring" id="stat-ring">
                    <svg viewBox="0 0 36 36">
                        <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="ring-fill" id="ring-fill" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <span class="stat-ring-text" id="stat-progress">0%</span>
                </div>
                <span class="stat-label">COMPLETED</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-done-count">0</span>
                <span class="stat-label">MOVES</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-label">TOTAL</span>
            </div>
        </div>

        <!-- Content -->
        <main class="content-area" id="view-container"></main>

        <!-- Navigation -->
        <nav class="nav-bar">
            <div class="nav-inner">
                <button class="nav-btn active" data-view="today" onclick="switchView('today')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="nav-label">TODAY</span>
                </button>
                <button class="nav-btn" data-view="week" onclick="switchView('week')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span class="nav-label">WEEK</span>
                </button>
                <button class="nav-btn" data-view="profile" onclick="switchView('profile')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="nav-label">PROFILE</span>
                </button>
            </div>
        </nav>
    </div>

    <script src="src/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>

</html>
